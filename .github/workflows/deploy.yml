name: Build and Deploy

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir build
          cp index.html build/

      - name: Zapisanie artefaktu build
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie artefaktu build
        uses: actions/download-artifact@v4
        with:
          name: website-build
          path: build/

      - name: Deploy
        run: |
          echo "Pliki przygotowane do wdrożenia:"
          ls -la build/
          echo "Deploy do VPS zostanie wykonany po skonfigurowaniu SSH"
