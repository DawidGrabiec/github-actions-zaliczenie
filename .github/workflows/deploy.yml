name: Build and Deploy

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir build
          cp index.html build/

      - name: Zapisanie artefaktu build
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie artefaktu build
        uses: actions/download-artifact@v4
        with:
          name: website-build
          path: build/

      - name: Konfiguracja SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy przez SSH
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "mkdir -p ~/website"

          scp -r build/* \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/website/"
